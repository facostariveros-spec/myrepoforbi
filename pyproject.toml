[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-grid-manager"
version = "0.1.0"
description = "Adaptive Grid Manager connectivity service"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
